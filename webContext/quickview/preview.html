<!doctype html>
<html>
  <head>
    <base href="/" />
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
    <meta name="renderer" content="webkit" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"
    />
    <title>Cloudflow-Preview</title>
    <link rel="icon" type="image/x-icon" href="img/icon.png" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/jit-viewer@1.5.0/dist/iife/jit-viewer.min.css"
    />
  </head>

  <body>
    <div id="viewer-container"></div>

    <script src="https://cdn.jsdelivr.net/npm/jit-viewer@1.5.0/dist/iife/jit-viewer.min.js"></script>
    <script>
      (function () {
        var params = new URLSearchParams(location.search);
        var fileId = params.get("fileId") || "";
        var fileName = params.get("name") || "";

        if (!fileId) return;

        var viewer = JitViewer.createViewer({
          file: "resourceController/getResource/" + fileId,
          filename: fileName ? decodeURIComponent(fileName) : undefined,
          toolbar: true,
          theme: "light",
        });

        viewer.mount("#viewer-container");
      })();
    </script>
  </body>
</html>
