<!doctype html>
<html>
  <head>
    <base href="/" />
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
    <meta name="renderer" content="webkit" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>KPlayer</title>
    <link rel="stylesheet" href="css/bootstrap.min.css" />
    <link rel="stylesheet" href="css/overrall.min.css?v=82ad4fdd" />
    <link rel="stylesheet" href="css/video-js.min.css" />
    <link rel="icon" type="image/x-icon" href="img/player.png" />
    <!--[if lt IE 9]>
      <script type="text/javascript" src="js/videojs-ie8.min.js"></script>
      <script src="js/html5shiv.min.js"></script>
      <script src="js/respond.min.js"></script>
    <![endif]-->
    <style type="text/css">
      @media only screen and (max-width: 992px) {
        #Cloudflowplayer {
          width: 100%;
          height: 400px;
        }
      }

      @media only screen and (max-width: 768px) {
        #Cloudflowplayer {
          height: 300px;
        }
      }

      @media only screen and (max-width: 488px) {
        #Cloudflowplayer {
          height: 230px;
        }
      }
    </style>
  </head>

  <body>
    <div class="container">
      <div class="row">
        <div class="col-md-12">
          <div class="titlebox">
            <span class="titletext"
              ><em>
                云流视频播放器
                <small><span class="graytext">Cloudflow-Player</span></small></em
              ></span
            >
            <button
              id="closeBtn"
              class="btn btn-link rightbtn"
              onclick="reMainPage()"
            >
              关闭
              <span
                class="glyphicon glyphicon-share-alt"
                aria-hidden="true"
              ></span>
            </button>
          </div>
          <hr />
        </div>
      </div>

      <div class="row">
        <div class="col-md-12">
          <p class="subtitle">视频名称：<span id="vname">加载中...</span></p>
          <p class="subtitle">
            <span id="vcreator">加载中...</span>/<span id="vcdate"
              >加载中...</span
            >/<span id="vsize">加载中...</span>
          </p>
          <br />
          <!-- 播放窗口组件位置 -->
          <div id="playerbox" class="col-md-12">
            <div class="text-center">
              <img alt="loading..." src="img/loading.gif" />
            </div>
            <div class="text-center" id="playerMassage">
              <h2>加载中...</h2>
            </div>
          </div>
        </div>
      </div>
    </div>
  </body>
  <script type="text/javascript" src="js/jquery.min.js"></script>
  <script type="text/javascript">
    // CSRF Token 支持：读取 XSRF-TOKEN Cookie 并加入 AJAX 请求头
    (function () {
      function getCookie(name) {
        var value = "; " + document.cookie;
        var parts = value.split("; " + name + "=");
        if (parts.length === 2) return parts.pop().split(";").shift();
        return null;
      }
      var csrfToken = getCookie("XSRF-TOKEN");
      if (csrfToken && typeof jQuery !== "undefined") {
        jQuery.ajaxSetup({
          headers: { "X-XSRF-TOKEN": csrfToken },
          xhrFields: { withCredentials: true }
        });
      }
    })();
  </script>
  <script type="text/javascript" src="js/bootstrap.min.js"></script>
  <script type="text/javascript" src="js/video.min.js"></script>
  <script type="text/javascript" src="js/kplayer.min.js?v=ad83bc26"></script>
  <!-- 统一提示模态框 -->
  <div
    class="modal fade"
    id="kiftdAlertModal"
    tabindex="-1"
    role="dialog"
    aria-labelledby="kiftdAlertTitle"
  >
    <div class="modal-dialog modal-sm" role="document">
      <div class="modal-content">
        <div class="modal-header">
          <button
            type="button"
            class="close"
            data-dismiss="modal"
            aria-label="Close"
          >
              <span aria-hidden="true">&times;</span>
            </button>
          <h4 class="modal-title" id="kiftdAlertTitle">
            <span class="glyphicon glyphicon-info-sign"></span> 提示
          </h4>
        </div>
        <div class="modal-body">
          <p id="kiftdAlertText"></p>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-primary" data-dismiss="modal">
            确定
          </button>
        </div>
      </div>
    </div>
  </div>
  <!-- end 统一提示模态框 -->
</html>
